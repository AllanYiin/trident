name: Legacy training regressions

on:
  push:
    paths:
      - 'trident/**'
      - 'tests/test_legacy_*.py'
      - 'tests/test_loss_parity.py'
      - 'tests/loss_backend_probe.py'
      - 'tests/test_training_save_guardrails.py'
      - 'requirements.txt'
      - '.github/workflows/legacy-training.yml'
  pull_request:
    paths:
      - 'trident/**'
      - 'tests/test_legacy_*.py'
      - 'tests/test_loss_parity.py'
      - 'tests/loss_backend_probe.py'
      - 'tests/test_training_save_guardrails.py'
      - 'requirements.txt'
      - '.github/workflows/legacy-training.yml'

jobs:
  loss-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt pytest 'tensorflow-cpu==2.20.*' 'jax[cpu]==0.4.35'
      - run: python -m pytest -q tests/test_loss_parity.py

  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [pytorch, tensorflow]
    env:
      TRIDENT_BACKEND: ${{ matrix.backend }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt pytest
      - if: matrix.backend == 'pytorch'
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pytest -q tests/test_legacy_field_binding.py tests/test_legacy_fit.py tests/test_legacy_training.py tests/test_legacy_gradients.py tests/test_training_save_guardrails.py
      - if: matrix.backend == 'tensorflow'
        run: |
          python -m pip install 'tensorflow-cpu==2.20.*'
          python -m pytest -q tests/test_legacy_field_binding.py tests/test_legacy_fit.py tests/test_legacy_tf_gradients.py
